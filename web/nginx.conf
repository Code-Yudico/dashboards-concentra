# Freno a fuerza bruta contra la auth básica -- relevante ahora que el
# dashboard es alcanzable desde internet (Cloudflare Tunnel), no solo LAN.
# burst=10 nodelay: una carga normal de página (index.html + datos.js) pasa
# sin fricción; un script probando contraseñas queda limitado a ~5/min
# después del burst inicial.
limit_req_zone $binary_remote_addr zone=dashboard_auth:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    auth_basic "Dashboard Concentra";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # El snapshot cambia una vez al día: nunca servir una copia cacheada.
    add_header Cache-Control "no-store" always;

    location = /healthz {
        auth_basic off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        limit_req zone=dashboard_auth burst=10 nodelay;
        try_files $uri $uri/ =404;
    }
}
