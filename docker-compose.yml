services:
  # Rama alterna sin Grafana: un contenedor extrae la tabla de conexiones
  # Intelix una vez al día (dashboard-etl) y otro sirve el dashboard HTML
  # que la renderiza (dashboard-web). Dashboard y lógica de negocio
  # portados de un proyecto existente ("dash_conexiones_intelix") — ver
  # docs/ARQUITECTURA.md para la referencia y la comparación con la rama
  # Grafana (main).
  dashboard-etl:
    build:
      context: ./etl-diario
    container_name: dc_dashboard_etl
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      SNAPSHOT_CRON_SCHEDULE: ${SNAPSHOT_CRON_SCHEDULE}
      SNAPSHOT_OUTPUT_PATH: ${SNAPSHOT_OUTPUT_PATH}
      # gc_wfm.dbo.tbl_dashboard_users_intelix en 10.80.11.70\DEV — tabla
      # cruda de conexiones (no la vista agregada del datasource Grafana).
      MSSQL_INTELIX_1_HOST: ${MSSQL_INTELIX_1_HOST}
      MSSQL_INTELIX_1_DB: ${MSSQL_INTELIX_1_DB}
      MSSQL_INTELIX_1_USER: ${MSSQL_INTELIX_1_USER}
      MSSQL_INTELIX_1_PASS: ${MSSQL_INTELIX_1_PASS}
      MSSQL_INTELIX_1_ENCRYPT: ${MSSQL_INTELIX_1_ENCRYPT}
      MSSQL_INTELIX_1_TRUST_CERT: ${MSSQL_INTELIX_1_TRUST_CERT}
    volumes:
      - dashboard_data:/data
    networks:
      - dc_red

  dashboard-web:
    build:
      context: ./web
    container_name: dc_dashboard_web
    restart: unless-stopped
    depends_on:
      - dashboard-etl
    ports:
      - "8081:80"
    environment:
      TZ: ${TZ}
      NGINX_BASIC_AUTH_USER: ${NGINX_BASIC_AUTH_USER}
      NGINX_BASIC_AUTH_PASS: ${NGINX_BASIC_AUTH_PASS}
    volumes:
      - dashboard_data:/usr/share/nginx/html/data:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dc_red

  # Expone dashboard-web a internet sin abrir ningún puerto entrante en el
  # router/firewall de oficina — solo conexión saliente de este contenedor
  # hacia el borde de Cloudflare (que termina el HTTPS público con su
  # propio certificado). Ver docs/RUNBOOK.md para crear el túnel y obtener
  # CLOUDFLARE_TUNNEL_TOKEN desde el dashboard Zero Trust de Cloudflare.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: dc_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - dashboard-web
    networks:
      - dc_red

volumes:
  dashboard_data:
    name: dc_dashboard_data

networks:
  dc_red:
    name: dc_red
