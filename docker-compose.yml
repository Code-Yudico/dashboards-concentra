services:
  grafana:
    image: grafana/grafana-oss:11.6.0
    container_name: dc_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: ${TZ}
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: ${GF_USERS_ALLOW_SIGN_UP}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL}
      GF_LOG_LEVEL: info
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Consumidas por grafana/provisioning/datasources/mssql.yaml para
      # interpolar la conexión directa a SQL Server (ver docs/ARQUITECTURA.md).
      MSSQL_HOST: ${MSSQL_HOST}
      MSSQL_PORT: ${MSSQL_PORT}
      MSSQL_DB: ${MSSQL_DB}
      MSSQL_USER_GRAFANA: ${MSSQL_USER_GRAFANA}
      MSSQL_PASS_GRAFANA: ${MSSQL_PASS_GRAFANA}
      MSSQL_ENCRYPT: ${MSSQL_ENCRYPT}
      MSSQL_TRUST_CERT: ${MSSQL_TRUST_CERT}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - dc_red

volumes:
  grafana_data:
    name: dc_grafana_data

networks:
  dc_red:
    name: dc_red
