server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    auth_basic "Dashboard Concentra";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # El snapshot cambia una vez al día: nunca servir una copia cacheada.
    add_header Cache-Control "no-store" always;

    location = /healthz {
        auth_basic off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
