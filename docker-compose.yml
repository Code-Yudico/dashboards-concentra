services:
  # Rama alterna sin Grafana: un contenedor extrae la vista una vez al día
  # (dashboard-etl) y otro sirve el HTML estático que la renderiza
  # (dashboard-web). Ver docs/ARQUITECTURA.md para la comparación con la
  # rama Grafana (main).
  dashboard-etl:
    build:
      context: ./etl-diario
    container_name: dc_dashboard_etl
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      SNAPSHOT_CRON_SCHEDULE: ${SNAPSHOT_CRON_SCHEDULE}
      SNAPSHOT_OUTPUT_PATH: ${SNAPSHOT_OUTPUT_PATH}
      # Mismo origen y patrón de credenciales que ya usa la rama Grafana
      # para este datasource (grafana/provisioning/datasources/mssql-intelix.yaml).
      MSSQL_INTELIX_HOST: ${MSSQL_INTELIX_HOST}
      MSSQL_INTELIX_PORT: ${MSSQL_INTELIX_PORT}
      MSSQL_INTELIX_DB: ${MSSQL_INTELIX_DB}
      MSSQL_INTELIX_USER: ${MSSQL_INTELIX_USER}
      MSSQL_INTELIX_PASS: ${MSSQL_INTELIX_PASS}
    volumes:
      - dashboard_data:/data
    networks:
      - dc_red

  dashboard-web:
    build:
      context: ./web
    container_name: dc_dashboard_web
    restart: unless-stopped
    depends_on:
      - dashboard-etl
    ports:
      - "8081:80"
    environment:
      TZ: ${TZ}
      NGINX_BASIC_AUTH_USER: ${NGINX_BASIC_AUTH_USER}
      NGINX_BASIC_AUTH_PASS: ${NGINX_BASIC_AUTH_PASS}
    volumes:
      - dashboard_data:/usr/share/nginx/html/data:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dc_red

volumes:
  dashboard_data:
    name: dc_dashboard_data

networks:
  dc_red:
    name: dc_red
